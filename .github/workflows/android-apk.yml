name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Spendly.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk 2>/dev/null || gh release create apk --title "Spendly APK" --notes "Последняя сборка для Android. Скачайте Spendly.apk."
          gh release upload apk Spendly.apk --clobber

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spendly-debug-apk
          path: Spendly.apk
          if-no-files-found: error
          retention-days: 30
