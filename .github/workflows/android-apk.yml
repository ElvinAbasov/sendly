name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          VITE_POCKETBASE_URL: ${{ vars.VITE_POCKETBASE_URL }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Spendly.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Spendly APK
          body: Последняя сборка Spendly для Android. Скачайте Spendly.apk.
          files: Spendly.apk
          draft: false
          prerelease: false
          overwrite_files: true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spendly-debug-apk
          path: Spendly.apk
          if-no-files-found: error
          retention-days: 30
