app = 'spendly-pocketbase'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile.pocketbase'

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'pb_data'
  destination = '/pb_data'
